<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Aimaan — Builder, Learner, Student">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#150B24"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="8" y="8" width="1184" height="304" rx="24"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="1184" height="304" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#frameClip)">
    <rect x="8" y="8" width="1184" height="304" fill="url(#grid)"/>
    <circle cx="180" cy="40" r="190" fill="url(#glowViolet)" filter="url(#bigBlur)"/>
    <circle cx="1060" cy="300" r="180" fill="url(#glowCyan)" filter="url(#bigBlur)"/>
    <circle cx="620" cy="330" r="150" fill="url(#glowPink)" filter="url(#bigBlur)"/>

    <text x="70" y="74" font-family="'Fira Code','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="46" fill="#A78BFA" fill-opacity="0.18">&lt;/&gt;</text>
    <text x="1080" y="290" font-family="'Fira Code','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="46" fill="#22D3EE" fill-opacity="0.15">{ }</text>

    <g font-family="'Fira Code','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
      <rect x="44" y="38" width="168" height="34" rx="17" fill="#111827" stroke="#22D3EE" stroke-opacity="0.35"/>
      <circle cx="64" cy="55" r="4" fill="#22D3EE"/>
      <text x="78" y="61" font-size="15" fill="#22D3EE">~/aimaaan</text>

      <rect x="956" y="38" width="200" height="34" rx="17" fill="#111827" stroke="#F472B6" stroke-opacity="0.3"/>
      <circle cx="978" cy="55" r="4" fill="#F472B6"/>
      <text x="992" y="61" font-size="15" fill="#F9A8D4">learning mode: on</text>
    </g>

    <text x="600" y="172" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="86" font-weight="700" letter-spacing="14" fill="url(#neon)" filter="url(#softGlow)">AIMAAN</text>

    <text x="600" y="214" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="17" letter-spacing="9" fill="#94A3B8">BUILDER · LEARNER · STUDENT</text>

    <line x1="380" y1="240" x2="820" y2="240" stroke="url(#divider)" stroke-width="2"/>

    <g font-family="'Fira Code','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" fill="#64748B" text-anchor="middle">
      <text x="600" y="272">&lt;curiosity /&gt;   &lt;consistency /&gt;   &lt;craft /&gt;</text>
    </g>

    <path d="M 44 96 L 44 68 Q 44 56 56 56 L 84 56" fill="none" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M 1156 224 L 1156 252 Q 1156 264 1144 264 L 1116 264" fill="none" stroke="#F472B6" stroke-opacity="0.7" stroke-width="2"/>
  </g>

  <rect x="8" y="8" width="1184" height="304" rx="24" fill="none" stroke="#1F2937" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="304" rx="24" fill="none" stroke="url(#frame)" stroke-width="2"/>
</svg>